[pytest]
testpaths = tests
pythonpath = . tests
markers =
    integration: talks to REAL services (the local Ollama models with RUN_INTEGRATION=1, the Groq API with GROQ_API_KEY). Never part of a plain run: select with -m integration
# A plain `pytest` never runs integration tests, even when GROQ_API_KEY is exported in your shell. `-m integration` on the command
# line overrides this (the last -m wins).
addopts = -p no:cacheprovider -m "not integration"
# A test or app path that leaves a database connection open or a child process unreaped fails instead of printing a warning
# (review round 1 found three such leaks in the tests).
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
