# Checks every pull request and every push to main. Ollama is mocked in the backend tests, so no model is ever downloaded
# and nothing needs a GPU, a microphone or a cloud account.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels its run in progress (no duplicate work).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}     # never cancel runs on main (every commit keeps a status)

permissions:
  contents: read

jobs:
  lint:
    name: Lint, docs and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the pinned Python dev tools (hash-locked, generated from backend/requirements-dev.txt)
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Python lint (ruff, bug-finding rules)
        run: python -m ruff check --output-format=github .
      - name: Markdown links, images and anchors
        run: python scripts/check_docs.py
      - name: Frontend lint (ESLint, no warnings allowed)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  backend:
    name: Backend tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest      # the oldest Python the README promises
            python: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*
      - name: Install dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock   # exact, hash-checked versions (includes the runtime set)
      - name: Run tests
        run: python -m pytest backend -q -ra --cov=backend/app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend typecheck, tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage      # the unit tests, plus a line-coverage summary in the log
      - run: npm run build

  e2e-linux:
    name: Real-Chrome page checks (Linux, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend environment (hash-locked), where the e2e harness expects it
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements.lock
      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # The runner's Google Chrome; no Ollama (an unreachable address), so these are the suites that need no model or voice.
      - name: qa-sweep (every page, tab and dialog in light, dark, phone and tablet) and ui-audit (contrast, overflow)
        working-directory: frontend
        env:
          OLLAMA_HOST_URL: http://127.0.0.1:9
        run: |
          node e2e/qa-sweep.mjs
          node e2e/ui-audit.mjs

  launcher-smoke:
    name: Launcher smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `check` is read-only. On a runner without Ollama it reports the missing pieces and exits 1 (0 if nothing blocking is
      # missing). Anything else - a Python traceback, another exit code, or a report that never reaches the Ollama line - fails.
      - name: manage.py check runs on this OS
        shell: bash
        run: |
          set +e
          out=$(python scripts/manage.py check 2>&1); code=$?
          set -e
          echo "$out"
          echo "exit code: $code"
          if echo "$out" | grep -q "Traceback"; then echo "::error::manage.py check crashed"; exit 1; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then echo "::error::unexpected exit code $code"; exit 1; fi
          echo "$out" | grep -q "Ollama" || { echo "::error::the report never reached the Ollama check"; exit 1; }
      # The real start/stop path a user takes: install the hash-locked dependencies, build the UI, spawn the backend, then stop it.
      # The runner has no Ollama, so the app starts in its "local AI not ready" state: it must still serve the UI and answer health.
      - name: start, health check and stop (start.sh / stop.sh)
        if: runner.os != 'Windows'
        shell: bash
        env:
          OLLAMA_AUTOSTART: "0"
        run: |
          ./start.sh
          curl -sf http://127.0.0.1:3000/api/health > health.json
          cat health.json
          python -c "import json; h = json.load(open('health.json')); assert h['app'] == 'ok' and h['local_only'] and h['bind'] == '127.0.0.1:3000', h"
          curl -sf -o /dev/null http://127.0.0.1:3000/ || { echo "::error::the UI is not served"; exit 1; }
          ./stop.sh
          sleep 2
          if curl -s -m 3 -o /dev/null http://127.0.0.1:3000/api/health; then echo "::error::still running after stop"; exit 1; fi
      - name: start, health check and stop (scripts\run.bat start / stop.bat)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          OLLAMA_AUTOSTART: "0"
          LAI_NO_BROWSER: "1"
        run: |
          call scripts\run.bat start < NUL || exit /b 1
          curl -sf http://127.0.0.1:3000/api/health || exit /b 1
          curl -sf -o NUL http://127.0.0.1:3000/ || exit /b 1
          call stop.bat < NUL || exit /b 1
          ping -n 3 127.0.0.1 > NUL
          curl -s -m 3 -o NUL http://127.0.0.1:3000/api/health && (echo ::error::still running after stop & exit /b 1)
          exit /b 0
      # Only when the step above failed on Windows: show why (the launcher's log can be empty if the process dies very early).
      - name: Diagnose a failed start on Windows (backend log, import check, foreground start)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        working-directory: backend
        run: |
          Write-Host "--- logs/backend.log"; Get-Content ../logs/backend.log -ErrorAction SilentlyContinue
          Write-Host "--- import check"; .venv\Scripts\python -c "import app.main; print('import ok')"
          Write-Host "--- foreground start for 30 s"
          $p = Start-Process -FilePath .venv\Scripts\python.exe -ArgumentList '-m','uvicorn','app.main:app_factory','--factory','--port','3099' `
               -RedirectStandardOutput ../fg-out.txt -RedirectStandardError ../fg-err.txt -PassThru -NoNewWindow
          Start-Sleep 30
          try { (Invoke-WebRequest http://127.0.0.1:3099/api/health -UseBasicParsing).Content } catch { Write-Host "health: $_" }
          Write-Host "--- stderr"; Get-Content ../fg-err.txt
          Write-Host "--- stdout"; Get-Content ../fg-out.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
