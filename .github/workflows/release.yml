# Publishes a GitHub release when a version tag (v*) is pushed: runs the same checks as CI, then attaches a source archive and the
# CHANGELOG section for that version. Nothing is deployed anywhere; users still run the app from source.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pytest backend -q
      - name: Frontend checks
        working-directory: frontend
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Source archive
        run: git archive --format=zip --prefix="local-ai-interviewer-${GITHUB_REF_NAME}/" -o "local-ai-interviewer-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "local-ai-interviewer-${GITHUB_REF_NAME}.zip"
