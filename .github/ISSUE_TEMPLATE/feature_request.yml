name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: "What are you trying to do that is hard or impossible today?"}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: Proposed solution}
  - type: checkboxes
    id: local
    attributes:
      label: Local-first
      options:
        - label: This works without sending data off the computer (or is clearly opt-in)
